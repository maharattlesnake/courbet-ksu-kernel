name: Build Courbet KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libncurses5-dev libssl-dev libelf-dev git zip curl wget python3 device-tree-compiler lz4 cpio gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi

      - name: Install libtinfo5 (needed by Proton Clang)
        run: |
          sudo apt-get install -y libtinfo5 libncurses5 || true

      - name: Clone toolchain (Proton Clang)
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone kernel source
        run: |
          git clone --depth=1 https://github.com/MiCode/Xiaomi_Kernel_OpenSource -b courbet-r-oss kernel-source

      - name: Integrate KernelSU-Next (legacy)
        run: |
          cd kernel-source
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

      - name: Enable KSU in defconfig
        run: |
          cd kernel-source
          if [ -f arch/arm64/configs/courbet_user_defconfig ]; then
            DEFCONFIG=arch/arm64/configs/courbet_user_defconfig
          else
            DEFCONFIG=arch/arm64/configs/vendor/courbet_user_defconfig
          fi
          echo "Defconfig: $DEFCONFIG"
          if [ ! -f "$DEFCONFIG" ]; then
            echo "courbet_user_defconfig not found"
            exit 1
          fi
          echo "$DEFCONFIG" > ../defconfig_path.txt
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          # CONFIG_CRYPTO_AES_ARM64_CE_BLK is not set
          # CONFIG_CRYPTO_AES_ARM64_NEON_BLK is not set
          # CONFIG_CRYPTO_AES_ARM64_BS is not set
          # CONFIG_RANDOMIZE_BASE is not set
          # CONFIG_RELOCATABLE is not set
          EOF
          sed -i 's/^[[:space:]]*\(CONFIG_[A-Z_0-9]*=y\)$/\1/' "$DEFCONFIG"
          sed -i 's/^[[:space:]]*\(# CONFIG_[A-Z_0-9]* is not set\)$/\1/' "$DEFCONFIG"
          tail -n 10 "$DEFCONFIG"

      - name: Build kernel
        run: |
          cd kernel-source
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          DEFCONFIG=$(cat ../defconfig_path.txt)
          DEFCONFIG_NAME=${DEFCONFIG#arch/arm64/configs/}

          # Fix 1: use clang integrated assembler (host x86 'as' does not know ARM64 options)
          grep -rIl "integrated-as" Makefile arch/arm64 scripts --include="Makefile*" --include="*.include" --include="*.mk" | xargs -r sed -i 's/-f\?no-integrated-as//g'

          # Fix 2: vdso macro call has an extra comma that clang's assembler rejects
          VDSO=arch/arm64/kernel/vdso/gettimeofday.S
          sed -i 's/^\([[:space:]]\+\)clock_gettime_return,/\1clock_gettime_return/' $VDSO

          # Fix 3: make clang use the ARM64 linker (host x86 'ld' does not know aarch64linux)
          LDBIN="$GITHUB_WORKSPACE/clang/bin/aarch64-linux-gnu-ld"
          ls -l "$LDBIN"

          # Fix 4: clang assembler rejects '.weak' placed before ENTRY() (memcpy/memmove/memset)
          for f in memcpy memmove memset; do
            F=arch/arm64/lib/$f.S
            sed -i "/^[[:space:]]*\.weak[[:space:]]\+$f\$/d; s/^ENTRY($f)/WEAK($f)/" $F
          done

          # Fix 5: duplicate DT label error (new dtc is stricter) -> force dtb output
          echo "--- duplicate label definitions ---"
          grep -rn "fsa_usbc_ana_en:" arch/arm64/boot/dts | head -n 10 || true
          echo 'DTC_FLAGS += -f' >> arch/arm64/boot/dts/qcom/Makefile

          make O=out ARCH=arm64 "$DEFCONFIG_NAME"
          echo "--- relocation related config ---"
          grep -E "CONFIG_RELOCATABLE|CONFIG_RANDOMIZE_BASE|CONFIG_MODVERSIONS" out/.config || true

          run_make() {
            make -k -j$(nproc --all) O=out ARCH=arm64 \
              CC=clang \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
              KCFLAGS="-fuse-ld=$LDBIN -Qunused-arguments" \
              "$@"
          }

          set +e
          run_make 2>&1 | tee ../build.log
          STATUS=${PIPESTATUS[0]}

          if [ $STATUS -ne 0 ]; then
            echo "=========== ATTEMPT 1 FAILED ==========="
            grep -n -E "error:|Error:|ERROR|undefined reference" ../build.log | grep -v "extract-cert" | head -n 20
            echo "=========== RETRY WITH LLD LINKER ==========="
            run_make LD=ld.lld 2>&1 | tee ../build2.log
            STATUS=${PIPESTATUS[0]}
          fi

          if [ $STATUS -ne 0 ]; then
            echo "=========== BUILD FAILED ==========="
            grep -n -E "error:|Error:|ERROR|undefined reference|unsupported|ld.lld" ../build2.log | head -n 30
            exit 1
          fi
          echo "=========== BUILD OK ==========="
          ls -l out/arch/arm64/boot

      - name: Pack with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          BOOT=kernel-source/out/arch/arm64/boot
          if [ -f $BOOT/Image.gz-dtb ]; then
            cp $BOOT/Image.gz-dtb AnyKernel3/
          elif [ -f $BOOT/Image-dtb ]; then
            cp $BOOT/Image-dtb AnyKernel3/
          elif [ -f $BOOT/Image.gz ]; then
            cp $BOOT/Image.gz AnyKernel3/
          else
            cp $BOOT/Image AnyKernel3/
          fi
          cd AnyKernel3
          sed -i 's/^device.name1=.*/device.name1=courbet/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=courbetin/' anykernel.sh
          sed -i 's/^do.devicecheck=.*/do.devicecheck=0/' anykernel.sh
          sed -i 's|^block=.*|block=boot;|' anykernel.sh
          sed -i 's/^is_slot_device=.*/is_slot_device=auto;/' anykernel.sh
          sed -i 's/^BLOCK=.*/BLOCK=boot;/' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=auto;/' anykernel.sh
          zip -r9 ../KernelSU-Next-Courbet.zip * -x .git README.md

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: KernelSU-Next-Courbet
          path: KernelSU-Next-Courbet.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            build2.log
